name: Deploy NMRNL to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: nmrnl-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run NMRNL Cloudflare'
    name: Build and deploy NMRNL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out NMRNL
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build NMRNL
        run: npm run build

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | xargs)"
          API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[Bb]earer[[:space:]]+//' | xargs)"

          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"

          echo "Cloudflare account ID length: ${#ACCOUNT_ID}"
          echo "Cloudflare API token length: ${#API_TOKEN}"

          STATUS="$(curl -sS -o /tmp/cf-token.json -w '%{http_code}'             -H "Authorization: Bearer $API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/user/tokens/verify || true)"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN during direct verification (HTTP $STATUS)."
            cat /tmp/cf-token.json | sed -E 's/"id":"[^"]+"/"id":"***"/g'
            exit 1
          fi

          echo "Cloudflare API token verified successfully."

      - name: Deploy Worker with Wrangler 4
        shell: bash
        run: npx --yes wrangler@4.127.1 deploy --config wrangler.jsonc
