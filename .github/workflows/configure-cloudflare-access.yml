name: Configure Cloudflare Access
# trigger: secrets-ready

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/configure-cloudflare-access.yml"
      - "cloudflare/access.config.json"
      - "scripts/configure-cloudflare-access.mjs"
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: nmrnl-cloudflare-access
  cancel-in-progress: false

jobs:
  configure-access:
    if: github.event_name != 'issues' || github.event.issue.title == 'Run NMRNL Cloudflare'
    name: Configure NMRNL Access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Check out NMRNL
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_OAUTH_CLIENT_ID"
            exit 1
          fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_OAUTH_CLIENT_SECRET"
            exit 1
          fi

      - name: Configure Cloudflare Access
        run: node scripts/configure-cloudflare-access.mjs
